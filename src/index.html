<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HPK 14 - Padel Hold</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="HPK 14">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-100 min-h-screen">
    <header class="bg-blue-600 text-white shadow-lg">
        <div class="container mx-auto px-4 py-6">
            <h1 class="text-3xl font-bold">HPK 14</h1>
            <p class="text-blue-200">Padel Hold</p>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-semibold text-gray-800">Aktiviteter</h2>
            <div class="flex gap-2">
                <button onclick="openRankedInModal()" class="bg-white hover:bg-gray-50 text-blue-600 font-semibold py-2 px-4 rounded-lg border border-blue-600 transition">
                    RankedIn
                </button>
                <a href="create.html" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition">
                    + Opret aktivitet
                </a>
            </div>
        </div>

        <div id="loading" class="text-center py-12">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-600 border-t-transparent"></div>
            <p class="mt-2 text-gray-600">Henter aktiviteter...</p>
        </div>

        <div id="no-activities" class="hidden text-center py-12">
            <p class="text-gray-500 text-lg">Ingen aktiviteter endnu</p>
            <a href="create.html" class="text-blue-600 hover:underline">Opret den første aktivitet</a>
        </div>

        <div id="activities-list" class="grid gap-4 md:grid-cols-2 lg:grid-cols-3">
            <!-- Activities will be loaded here -->
        </div>

        <!-- RankedIn Modal -->
        <div id="rankedin-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
            <div class="bg-white rounded-lg shadow-xl max-w-4xl w-full max-h-[90vh] overflow-y-auto">
                <div class="p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-semibold text-gray-800">RankedIn</h2>
                        <button onclick="closeRankedInModal()" class="text-gray-500 hover:text-gray-700 text-2xl">&times;</button>
                    </div>
                    <iframe
                        id="rankedin-iframe"
                        title="HPK 14 - RankedIn"
                        class="w-full border-0"
                        style="min-height: 1000px;"
                        loading="lazy">
                    </iframe>
                    <p class="text-center text-sm text-gray-500 mt-4">
                        Vises ikke korrekt? &Aring;bn siden direkte p&aring;
                        <a href="https://www.rankedin.com/en/team/homepage/3281414" target="_blank" rel="noopener" class="text-blue-600 hover:underline">rankedin.com</a>.
                    </p>
                </div>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', loadActivities);

        function openRankedInModal() {
            document.getElementById('rankedin-iframe').src = 'https://www.rankedin.com/en/team/embedhomepage/3281414';
            document.getElementById('rankedin-modal').classList.remove('hidden');
        }

        function closeRankedInModal() {
            document.getElementById('rankedin-modal').classList.add('hidden');
            document.getElementById('rankedin-iframe').src = '';
        }

        async function loadActivities() {
            const loading = document.getElementById('loading');
            const noActivities = document.getElementById('no-activities');
            const activitiesList = document.getElementById('activities-list');

            try {
                const activities = await api.getActivities();
                loading.classList.add('hidden');

                if (activities.length === 0) {
                    noActivities.classList.remove('hidden');
                    return;
                }

                activitiesList.innerHTML = activities.map(activity => {
                    const isMatch = activity.type === 'match';
                    const isMatchWithTooManyUnavailable = isMatch && (activity.unavailableCount || 0) >= 3;
                    const isMatchReady = isMatch && (activity.signupCount || 0) >= 6;

                    let cardClass = 'block bg-white rounded-lg shadow-md hover:shadow-lg transition p-6';
                    if (isMatchWithTooManyUnavailable) {
                        cardClass = 'block rounded-lg shadow-md hover:shadow-lg transition p-6 bg-orange-50 border-2 border-orange-400';
                    } else if (isMatchReady) {
                        cardClass = 'block rounded-lg shadow-md hover:shadow-lg transition p-6 bg-green-50 border-2 border-green-400';
                    }

                    return `
                    <a href="activity.html?id=${activity.id}" class="${cardClass}">
                        ${isMatchWithTooManyUnavailable ? `
                        <div class="bg-orange-500 text-white text-xs font-bold px-2 py-1 rounded mb-3 inline-block">
                            Mangler spillere!
                        </div>
                        ` : isMatchReady ? `
                        <div class="bg-green-500 text-white text-xs font-bold px-2 py-1 rounded mb-3 inline-block">
                            Klar til kamp!
                        </div>
                        ` : ''}
                        <div class="flex justify-between items-start mb-2">
                            <span class="inline-block px-2 py-1 text-xs font-semibold rounded ${getTypeColor(activity.type)}">
                                ${getTypeLabel(activity.type)}
                            </span>
                            <div class="text-right text-sm">
                                <span class="text-gray-500">${activity.signupCount || 0} tilmeldt</span>
                                ${(activity.unavailableCount || 0) > 0 ? `<br><span class="text-red-500">${activity.unavailableCount} afmeldt</span>` : ''}
                            </div>
                        </div>
                        <h3 class="text-xl font-semibold text-gray-800 mb-2">${escapeHtml(activity.name)}</h3>
                        <p class="text-gray-600 mb-1">
                            <span class="font-medium">Dato:</span> ${formatDate(activity.date)}
                        </p>
                        <p class="text-gray-600">
                            <span class="font-medium">Sted:</span> ${escapeHtml(activity.location)}
                        </p>
                    </a>
                `}).join('');
            } catch (error) {
                loading.innerHTML = `<p class="text-red-600">Kunne ikke hente aktiviteter</p>`;
                console.error('Error loading activities:', error);
            }
        }
    </script>
</body>
</html>
